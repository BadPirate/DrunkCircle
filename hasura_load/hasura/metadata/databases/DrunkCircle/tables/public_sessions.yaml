table:
  name: sessions
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: dc_server
    permission:
      check: {}
      columns:
        - id
        - session_token
        - user_id
        - expires
select_permissions:
  - role: dc_server
    permission:
      columns:
        - user_id
        - id
        - session_token
        - expires
      filter: {}
update_permissions:
  - role: dc_server
    permission:
      columns:
        - user_id
        - id
        - session_token
        - expires
      filter: {}
      check: {}
delete_permissions:
  - role: dc_server
    permission:
      filter: {}
