- name: allowed-queries
  definition:
    queries:
      - name: attendance_by_pk
        query: |
          query attendance_by_pk ($hasher: Int!, $trail: Int!) {
            attendance_by_pk(hasher: $hasher, trail: $trail) {
              attended
              hasher
              note
              paid
              trail
            }
          }
      - name: attendance
        query: |
          query attendance {
            attendance {
              attended
              hasher
              note
              paid
              trail
            }
          }
      - name: insert_attendance_one
        query: |
          mutation insert_attendance_one ($object: attendance_insert_input!) {
            insert_attendance_one(object: $object) {
              attended
              hasher
              note
              paid
              trail
            }
          }
      - name: update_attendance_by_pk
        query: |
          mutation update_attendance_by_pk ($hasher: Int!, $trail: Int!, $object: attendance_set_input!) {
            update_attendance_by_pk(pk_columns: {hasher:$hasher,trail:$trail}, _set: $object) {
              attended
              hasher
              note
              paid
              trail
            }
          }
      - name: delete_attendance_by_pk
        query: |
          mutation delete_attendance_by_pk ($hasher: Int!, $trail: Int!) {
            delete_attendance_by_pk(hasher: $hasher, trail: $trail) {
              attended
              hasher
              note
              paid
              trail
            }
          }
